plugins { id 'com.android.application' }

android {
    namespace 'com.gundal.aitrialroom'
    compileSdk 36

    defaultConfig {
        applicationId 'com.gundal.aitrialroom'
        minSdk 24
        targetSdk 36
        def vc = System.getenv('VERSION_CODE')
        if (vc == null || vc.isEmpty()) vc = '1'
        versionCode = Integer.parseInt(vc)
        versionName = '1.0.' + vc
        // PLAY_EDITION=1 -> Google Play version (subscription required); otherwise test edition for direct install
        buildConfigField 'boolean', 'PLAY_EDITION', (System.getenv('PLAY_EDITION') == '1') ? 'true' : 'false'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks != null && !ks.isEmpty() && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ksFile = System.getenv('KEYSTORE_FILE')
            boolean hasKey = ksFile != null && !ksFile.isEmpty() && file(ksFile).exists()
            // NO_SIGN=1: leave the Play bundle unsigned here; it is signed afterwards with the private upload key
            boolean noSign = System.getenv('NO_SIGN') == '1'
            signingConfig = noSign ? null : (hasKey ? signingConfigs.release : signingConfigs.debug)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    androidResources {
        noCompress 'wasm', 'tflite', 'binarypb', 'data'
    }
}

dependencies {
    // Google Play Billing (subscriptions); Play requires version 8 or newer from 31 Aug 2026
    implementation 'com.android.billingclient:billing:8.3.0'
}
