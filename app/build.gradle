plugins { id 'com.android.application' }

android {
    namespace 'com.gundal.aitrialroom'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gundal.aitrialroom'
        minSdk 24
        targetSdk 34
        def vc = System.getenv('VERSION_CODE')
        if (vc == null || vc.isEmpty()) vc = '1'
        versionCode = Integer.parseInt(vc)
        versionName = '1.0.' + vc
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks != null && !ks.isEmpty() && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ksFile = System.getenv('KEYSTORE_FILE')
            boolean hasKey = ksFile != null && !ksFile.isEmpty() && file(ksFile).exists()
            signingConfig = hasKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    androidResources {
        noCompress 'wasm', 'tflite', 'binarypb', 'data'
    }
}
