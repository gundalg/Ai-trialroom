plugins { id 'com.android.application' }

android {
    namespace 'com.gundal.aitrialroom'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gundal.aitrialroom'
        minSdk 24
        targetSdk 34
        versionCode (System.getenv('VERSION_CODE') ?: '1') as int
        versionName "1.0." + (System.getenv('VERSION_CODE') ?: '0')
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            def ks = System.getenv('KEYSTORE_FILE')
            signingConfig (ks && file(ks).exists()) ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    androidResources {
        noCompress 'wasm', 'tflite', 'binarypb', 'data'
    }
}
